# Only same-cluster pods in namespaces labelled jev-client=true may reach the service. Adjust to your policy model.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jev-style
spec:
  podSelector: {matchLabels: {app: jev-style}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {jev-client: "true"}}
      ports: [{port: 8765}]
